# Limine native protocol configuration for Zenith OS.
timeout: 5
default_entry: 1
wallpaper: boot():/wallpaper.png
wallpaper_style: stretched
interface_branding: Zenith OS
interface_branding_colour: A78BFA
interface_help_hidden: yes
quiet: no

/Zenith OS
    protocol: limine
    kernel_path: boot():/kernel.bin
    cmdline: zenith
    resolution: 1280x800x32

/Zenith OS (safe graphics)
    protocol: limine
    kernel_path: boot():/kernel.bin
    cmdline: zenith safe
    resolution: 800x600x32

/Text recovery console
    protocol: limine
    kernel_path: boot():/kernel.bin
    cmdline: zenith text
    resolution: 1024x768x32
