# Limine bootloader configuration for Zenith OS.
#
# The kernel carries both a Multiboot2 header and a PVH note. This entry uses
# Multiboot2; QEMU can also load the ELF directly via the PVH note
# (`cd kernel && make qemu`).

timeout: 0
default_entry: 1

/Zenith OS
    protocol: multiboot2
    kernel_path: boot():/kernel.bin
    cmdline: zenith
    resolution: 1024x768x32
    textmode: no
