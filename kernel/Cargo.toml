[package]
name = "zenith-kernel"
version.workspace = true
edition = "2021"
# The Rust side is a static library linked against the assembly entry point.
# src/main.rs is retained as documentation only and is not a build target.
autobins = false

[features]
native-run = []

[dependencies]
linked_list_allocator = { version = "0.10.6", default-features = false }
zenith-ui = { path = "../gui/zenith-ui" }
zenith-elf = { path = "elf" }
zenith-fs = { path = "../filesystem/zenith-fs" }
zenith-hid = { path = "../drivers/hid" }

[lib]
crate-type = ["staticlib"]
# Bare-metal kernel cannot host the standard Rust test harness.
test = false
